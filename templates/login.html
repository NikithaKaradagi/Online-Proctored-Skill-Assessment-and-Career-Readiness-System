<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== BODY ===== */
body {
    margin: 0;
    height: 100vh;

    background: url("https://images.unsplash.com/photo-1503676260728-1c00da094a0b") no-repeat center;
    background-size: cover;

    font-family: Arial, sans-serif;
}

/* ===== OVERLAY ===== */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.3)0%, rgba(30,85,165,0.85)50%);
    z-index: 0;
}

/* ===== HEADING ===== */
.main-heading {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 2;
}

.main-heading h1 {
    font-size: 30px;
    font-weight: bold;
}

.main-heading p {
    font-size: 14px;
    opacity: 0.9;
}

/* ===== CENTER WRAPPER ===== */
.center-wrapper {
    position: relative;
    z-index: 2;

    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== LOGIN CARD ===== */
.auth-card {
    width: 380px;
    background: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 20px;

    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

/* ===== BUTTON ===== */
.btn-primary {
    background: linear-gradient(to right, #4c6ef5, #3b5bdb);
    border: none;
}

</style>

</head>

<body>

<!-- ===== HEADING ===== -->
<div class="main-heading">
    <h1>🎓 Career Readiness System</h1>
    <p>Online Proctored Skill Assessment Platform</p>
</div>

<!-- ===== CENTERED LOGIN ===== -->
<div class="center-wrapper">

    <div class="auth-card">

        <h3 class="text-center mb-4">Login to Your Account</h3>

        {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email" required>
                <label>Email Address</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
                <label>Password</label>
            </div>

            <button class="btn btn-primary w-100">Login</button>

        </form>

        <p class="text-center mt-3">
            New user? <a href="/register">Create Account</a>
        </p>

        <p class="text-center">
            <a href="/forgot_password">Forgot Password?</a>
        </p>

    </div>

</div>

</body>
</html>
