<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="auth-wrapper">

    <!-- SAME HEADER -->
    <div class="auth-header">
        <h1>🎓 Career Readiness System</h1>
        <p>Reset your password</p>
    </div>

    <!-- SAME CARD -->
    <div class="auth-card width: 300px">

        <h3 class="text-center mb-4">Forgot Password</h3>

        {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <!-- STEP 1: EMAIL -->
        {% if step == "email" %}
        <form method="POST">
            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email" required>
                <label>Email Address</label>
            </div>

            <button class="btn-primary-custom w-100 mt-3">Send OTP</button>
        </form>
        {% endif %}

        <!-- STEP 2: OTP -->
        {% if step == "otp" %}
        <form method="POST">
            <div class="form-floating mb-3">
                <input type="text" name="otp" class="form-control" placeholder="OTP" required>
                <label>Enter OTP</label>
            </div>

            <button class="btn-primary-custom w-100 mt-3">Verify OTP</button>
        </form>
        {% endif %}

        <!-- STEP 3: RESET PASSWORD -->
        {% if step == "reset" %}
        <form method="POST">
            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" placeholder="New Password" required>
                <label>New Password</label>
            </div>

            <button class="btn-primary-custom w-100 mt-3">Reset Password</button>
        </form>
        {% endif %}

        <p class="text-center mt-4">
            Back to <a href="/">Login</a>
        </p>
        <p class="text-center mt-4">
            Doesn't have account? <a href="/register">Register</a>
        </p>
    </div>

</div>

</body>
</html>
