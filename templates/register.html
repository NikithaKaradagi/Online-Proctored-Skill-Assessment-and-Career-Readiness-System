<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-header">
        <h1>🎓 Career Readiness System</h1>
        <p>Create your account to begin assessment</p>
    </div>

    <div class="auth-card register-wide">

        <h3 class="text-center mb-4">Create Account</h3>

        {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">

            <div class="row g-3">

                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" name="fullname" class="form-control" placeholder="Full Name" required>
                        <label>Full Name</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="email" name="email" class="form-control" placeholder="Email" required>
                        <label>Email Address</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                        <label>Password</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="date" name="dob" class="form-control" required>
                        <label>Date of Birth</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" name="course" class="form-control" placeholder="Course" required>
                        <label>Course Studying</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" name="college" class="form-control" placeholder="College" required>
                        <label>College Name</label>
                    </div>
                </div>

                <div class="col-12 mt-3">
                    <label class="mb-2">Upload Photo (Optional)</label>
                    <input type="file" name="photo" class="form-control">
                </div>

            </div>

            <button class="btn-primary-custom w-100 mt-4">Register</button>

        </form>

        <p class="text-center mt-4">
            Already have account? <a href="/">Login</a>
        </p>

    </div>

</div>

</body>
</html>
