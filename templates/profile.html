<link href="https://unpkg.com/cropperjs/dist/cropper.css" rel="stylesheet"/>

{% extends "base.html" %}
{% block content %}



<script src="https://unpkg.com/cropperjs/dist/cropper.js"></script>

<div class="text-center mb-4">

    {% if user[5] %}
        <img src="{{ url_for('static', filename='uploads/' + user[5]) }}"
             class="profile-photo">
    {% endif %}

</div>

<div class="dashboard-card">

    <h2 class="text-center mb-5">Profile Details</h2>

    <form method="POST" enctype="multipart/form-data">

        <div class="row g-4">

            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullname"
                       value="{{ user[0] }}"
                       class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email"
                       value="{{ user[1] }}"
                       class="form-control"
                       disabled>
            </div>

            <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input type="date"
                       name="dob"
                       value="{{ user[2] }}"
                       class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Course</label>
                <input type="text"
                       name="course"
                       value="{{ user[3] }}"
                       class="form-control">
            </div>

            <div class="col-12">
                <label class="form-label">College</label>
                <input type="text"
                       name="college"
                       value="{{ user[4] }}"
                       class="form-control">
            </div>

       
        <div class="col-mb-3">
       <label class="form-label">Change Profile Photo</label>
      <input type="file"  name="photo" class="form-control">
      </div>

   </div>


        <div class="text-center mt-5">
            <button class="start-btn">Update Details</button>
        </div>

     <div class="text-center">
     <div id="cropContainer" style="display:none; text-align:center;">
    <img id="previewImage" style="max-width:300px;">
</div>
</div>

    </form>

</div>



<script>
let cropper;
let photoInput = document.getElementById("photoInput");
let cropImage = document.getElementById("cropImage");
let cropModal = new bootstrap.Modal(document.getElementById('cropModal'));

photoInput.addEventListener("change", function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(event) {
        cropImage.src = event.target.result;
        cropModal.show();

        if (cropper) {
            cropper.destroy();
        }

        cropper = new Cropper(cropImage, {
            aspectRatio: 1,
            viewMode: 1
        });
    };

    reader.readAsDataURL(file);
});

document.getElementById("cropSave").addEventListener("click", function() {
    let canvas = cropper.getCroppedCanvas({
        width: 300,
        height: 300
    });

    let base64 = canvas.toDataURL("image/png");

    let hiddenInput = document.createElement("input");
    hiddenInput.type = "hidden";
    hiddenInput.name = "croppedImage";
    hiddenInput.value = base64;

    document.querySelector("form").appendChild(hiddenInput);

    cropModal.hide();
});
</script>


<!-- Crop Modal -->
<div class="modal fade" id="cropModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <h5 class="text-center mb-3">Crop Image</h5>
      <div>
        <img id="cropImage" style="max-width:100%;">
      </div>
      <div class="text-center mt-3">
        <button id="cropSave" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}
